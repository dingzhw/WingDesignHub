[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wingdesignhub"
version = "0.1.5"
description = "Traceable conceptual aircraft design workbench"
requires-python = ">=3.13,<3.15"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "streamlit>=1.45,<2", "psutil>=7,<8"]

[project.optional-dependencies]
engineering = ["fast-oad-cs23==1.4.0", "openaerostruct>=2.12,<3", "control>=0.10,<0.11"]
test = ["pytest>=8,<10"]

[project.scripts]
wingdesignhub = "wingdesignhub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
